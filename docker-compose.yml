# Local infrastructure for PolyMirror.
#   docker compose up -d postgres        # database only (for `pnpm dev`)
#   docker compose up -d --build         # database + backend (demo mode)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polymirror
      POSTGRES_PASSWORD: polymirror
      POSTGRES_DB: polymirror
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polymirror']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATA_MODE: ${DATA_MODE:-demo}
      DATABASE_URL: postgresql://polymirror:polymirror@postgres:5432/polymirror?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-chrome-extension://*}
      LOG_LEVEL: info
    ports:
      - '4000:4000'

volumes:
  pgdata:
