name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polymirror
          POSTGRES_PASSWORD: polymirror
          POSTGRES_DB: polymirror
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polymirror" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://polymirror:polymirror@localhost:5432/polymirror?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm build
      - name: E2E (extension)
        run: |
          npx playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-dist
          path: apps/extension/dist
